# docker compose up --build   ->  http://localhost:8000  (app + Postgres, seeded on first boot)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: invoice
      POSTGRES_DB: invoice
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice"]
      interval: 3s
      retries: 20
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://invoice:invoice@db:5432/invoice
      LLM_MODE: ${LLM_MODE:-cached}          # cached = use pre-warmed extractions; live = always call the API
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}            # anthropic | gemini (auto-detected from whichever key is set)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
volumes:
  pgdata:

