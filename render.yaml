# Render blueprint: one web service (Docker) + managed Postgres.  New > Blueprint > pick this repo.
services:
  - type: web
    name: invoice-agent
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: invoice-db, property: connectionString }
      - key: LLM_MODE
        value: cached
      - key: GEMINI_API_KEY
        sync: false          # REQUIRED: set it in the Render dashboard. The 11 sample PDFs work from the committed cache
                             # without it, but any other upload cannot be read and goes to PENDING.
      - key: ANTHROPIC_API_KEY
        sync: false          # alternative to Gemini; leave empty if unused
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite   # free tier: ~15 req/min, 500/day (gemini-3.6/3.8-flash: only 20/day)
      - key: APP_PASSWORD
        sync: false          # optional: puts the whole site behind a shared password
databases:
  - name: invoice-db
    plan: free
